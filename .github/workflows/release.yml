name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example v2.0.1"
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="${INPUT_VERSION}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Tag must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; choose a new version." >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        working-directory: web
        env:
          VITE_APP_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm ci
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Verify source
        run: |
          go mod verify
          go vet ./...
          go test ./...

      - name: Build release archives
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p release staging
          targets=(
            "windows amd64"
            "windows arm64"
            "darwin amd64"
            "darwin arm64"
            "linux amd64"
            "linux arm64"
          )
          for target in "${targets[@]}"; do
            read -r os arch <<< "${target}"
            package="easyagent_${VERSION}_${os}_${arch}"
            package_dir="staging/${package}"
            mkdir -p "${package_dir}"
            binary="easyagent"
            if [[ "${os}" == "windows" ]]; then
              binary="easyagent.exe"
            fi
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT}" \
              -o "${package_dir}/${binary}" ./cmd/easyagent
            cp README.md LICENSE "${package_dir}/"
            if [[ "${os}" == "windows" ]]; then
              (cd staging && zip -q -r "../release/${package}.zip" "${package}")
            else
              tar -C staging -czf "release/${package}.tar.gz" "${package}"
            fi
          done
          (cd release && sha256sum easyagent_* > checksums.txt)

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          release_flags=(--generate-notes --title "EasyAgent ${TAG}")
          if [[ "${VERSION}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          release_flags+=(--target "${GITHUB_SHA}")
          gh release create "${TAG}" release/* "${release_flags[@]}"
